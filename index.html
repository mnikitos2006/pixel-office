<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Office — AI Agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0c1220;
      --bg-panel: #121a2b;
      --bg-panel-2: #182238;
      --line: #2a3a55;
      --text: #e8eef8;
      --muted: #8b9bb8;
      --accent: #3dd68c;
      --accent-dim: #1f8f5a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #1a2744 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 80%, #132a22 0%, transparent 50%),
        var(--bg-deep);
      color: var(--text);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #1a2438, #121a2b);
      border: 2px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 28px; height: 28px; flex-shrink: 0;
      border: 2px solid var(--accent);
      background: #182238;
      image-rendering: pixelated;
    }
    .brand h1 {
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      line-height: 1.4;
    }
    .brand p { color: var(--muted); font-size: 11px; margin-top: 3px; }

    .status-pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border: 1px solid var(--line);
      background: var(--bg-panel-2); font-size: 11px; color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; background: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 214, 140, 0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 10px;
      min-height: 0;
    }

    .stage-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      background: #070b12;
      overflow: hidden;
      min-height: 0;
    }

    canvas#office {
      display: block;
      flex-shrink: 0;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      cursor: crosshair;
    }

    .pix-overlay {
      position: absolute;
      left: 0; top: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }
    .pix-name {
      position: absolute;
      left: 0; top: 0;
      padding: 1px 4px;
      background: rgba(8, 12, 20, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      will-change: transform;
    }
    .pix-bubble {
      position: absolute;
      left: 0; top: 0;
      max-width: 160px;
      padding: 4px 6px;
      background: #f4f0e8;
      color: #1a1a1a;
      border: 1px solid #cfc6b4;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      will-change: transform;
    }
    .pix-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 8px; height: 8px;
      margin-left: -4px;
      background: #f4f0e8;
      border-right: 1px solid #cfc6b4;
      border-bottom: 1px solid #cfc6b4;
      transform: rotate(45deg);
    }

    .hint {
      position: absolute; left: 10px; bottom: 10px;
      font-size: 10px; color: rgba(232, 238, 248, 0.7);
      background: rgba(12, 18, 32, 0.75);
      border: 1px solid var(--line);
      padding: 6px 8px;
      pointer-events: none;
    }

    .loading {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: #070b12;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      color: var(--muted);
      z-index: 2;
    }
    .loading.hidden { display: none; }

    .detail {
      position: absolute; top: 10px; right: 10px;
      width: min(260px, calc(100% - 20px));
      background: rgba(12, 18, 32, 0.92);
      border: 2px solid var(--line);
      padding: 10px;
      display: none;
    }
    .detail.open { display: block; }
    .detail h3 { font-family: "Press Start 2P", monospace; font-size: 9px; margin-bottom: 8px; }
    .detail p { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 6px; }
    .detail .task { color: var(--text); }

    .side {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      border: 2px solid var(--line);
      background: var(--bg-panel);
    }

    .side-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid var(--line); }
    .side-tabs button {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 11px;
      padding: 10px; cursor: pointer;
    }
    .side-tabs button.active {
      color: var(--text); background: var(--bg-panel-2);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .panel { display: none; min-height: 0; overflow: auto; }
    .panel.active { display: block; }

    .chat { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .msg {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      padding: 8px;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .msg .meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 10px; }
    .msg .who { font-weight: 600; }
    .msg .when { color: var(--muted); }
    .msg .body { font-size: 12px; line-height: 1.45; color: #d5deee; }

    .agent-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .agent-row {
      display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center;
      padding: 8px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%;
    }
    .agent-row:hover, .agent-row.selected {
      border-color: var(--accent-dim);
      background: rgba(61, 214, 140, 0.06);
    }
    .agent-swatch { width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.25); }
    .agent-row .name { font-size: 12px; font-weight: 600; }
    .agent-row .role { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .agent-row .state { font-size: 10px; color: var(--accent); text-transform: uppercase; }

    .composer {
      display: grid; grid-template-columns: 1fr auto; gap: 6px;
      padding: 8px; border-top: 2px solid var(--line); background: var(--bg-panel-2);
    }
    .composer input {
      background: #0c1220; border: 1px solid var(--line); color: var(--text);
      padding: 10px; font: inherit; font-size: 12px; outline: none;
    }
    .composer input:focus { border-color: var(--accent-dim); }
    .composer button, .toolbar button {
      appearance: none; border: 1px solid var(--accent-dim);
      background: linear-gradient(180deg, #2a9b66, #1f8f5a);
      color: #04140c; font: inherit; font-size: 11px; font-weight: 600;
      padding: 10px 12px; cursor: pointer;
    }
    .toolbar button.ghost {
      background: transparent; border-color: var(--line); color: var(--muted);
    }

    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      justify-content: space-between;
      padding: 8px 10px; border: 2px solid var(--line);
      background: linear-gradient(180deg, #151e30, #101826);
    }
    .toolbar .left, .toolbar .right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .credit { font-size: 10px; color: var(--muted); }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: minmax(280px, 1fr) minmax(220px, 40vh); }
      .brand p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>PIXEL OFFICE</h1>
          <p>Офис в стиле pixel-agents — демо для Никиты</p>
        </div>
      </div>
      <div class="status-pills">
        <div class="pill"><span class="dot"></span> Live</div>
        <div class="pill" id="onlineCount">0 online</div>
        <div class="pill" id="clock">--:--</div>
      </div>
    </header>

    <div class="main">
      <div class="stage-wrap">
        <div class="loading" id="loading">Loading office…</div>
        <canvas id="office" width="336" height="352"></canvas>
        <div class="pix-overlay" id="pixOverlay" aria-hidden="true"></div>
        <div class="hint">Кликни агента · пробел — пауза</div>
        <aside class="detail" id="detail">
          <h3 id="detailName">Agent</h3>
          <p id="detailRole"></p>
          <p class="task" id="detailTask"></p>
          <p id="detailThought"></p>
        </aside>
      </div>

      <aside class="side">
        <div class="side-tabs">
          <button class="active" data-tab="chat">Chat</button>
          <button data-tab="agents">Agents</button>
        </div>
        <div class="panel active" id="panel-chat">
          <div class="chat" id="chat"></div>
        </div>
        <div class="panel" id="panel-agents">
          <div class="agent-list" id="agentList"></div>
        </div>
        <form class="composer" id="composer">
          <input id="brief" type="text" maxlength="160" placeholder="Дай задачу офису…" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </aside>
    </div>

    <footer class="toolbar">
      <div class="left">
        <button type="button" id="btnPause">Pause</button>
        <button type="button" class="ghost" id="btnBurst">Work burst</button>
        <button type="button" class="ghost" id="btnMeeting">Standup</button>
      </div>
      <div class="right">
        <span class="pill" id="taskStat" style="border:0;background:transparent;padding:0">0 в работе</span>
        <a class="credit" href="https://github.com/pixel-agents-hq/pixel-agents" target="_blank" rel="noopener">assets: pixel-agents (MIT)</a>
      </div>
    </footer>
  </div>

  <script src="office.js?v=3"></script>
  <script>
    const chatEl = document.getElementById("chat");
    const agentListEl = document.getElementById("agentList");
    const detail = document.getElementById("detail");
    let selectedId = null;
    let office;
    let simMin = 9 * 60;

    function addMsg(who, body, kind = "chat") {
      const agents = office ? office.getAgents() : [];
      const ag = agents.find((a) => a.name === who);
      const colors = {
        Ada: "#5b8cff", Grace: "#3dd68c", Linus: "#f0b429",
        Turing: "#c084fc", Hopper: "#ef6b6b", Noether: "#38bdf8", You: "#e8eef8",
      };
      const el = document.createElement("div");
      el.className = "msg";
      el.innerHTML = `
        <div class="meta">
          <span class="who" style="color:${ag?.color || colors[who] || "#8b9bb8"}">${kind === "output" ? "● output " : ""}${who}</span>
          <span class="when">now</span>
        </div>
        <div class="body">${body}</div>`;
      chatEl.prepend(el);
      while (chatEl.children.length > 40) chatEl.lastChild.remove();
    }

    function renderAgents(list) {
      agentListEl.innerHTML = list.map((a) => `
        <button class="agent-row ${selectedId === a.id ? "selected" : ""}" data-id="${a.id}">
          <span class="agent-swatch" style="background:${a.color}"></span>
          <span>
            <div class="name">${a.name}</div>
            <div class="role">${a.role}</div>
          </span>
          <span class="state">${a.state}</span>
        </button>`).join("");
    }

    document.querySelectorAll(".side-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".side-tabs button").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
      });
    });

    agentListEl.addEventListener("click", (e) => {
      const row = e.target.closest("[data-id]");
      if (row && office) office.selectAgent(row.dataset.id);
    });

    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("brief");
      const text = input.value.trim();
      if (!text || !office) return;
      office.assignBrief(text);
      input.value = "";
    });

    document.getElementById("btnPause").addEventListener("click", () => {
      if (!office) return;
      office.setPaused(!office.paused);
      document.getElementById("btnPause").textContent = office.paused ? "Resume" : "Pause";
    });
    document.getElementById("btnBurst").addEventListener("click", () => office?.workBurst());
    document.getElementById("btnMeeting").addEventListener("click", () => office?.standup());

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        document.getElementById("btnPause").click();
      }
    });

    (async () => {
      office = new PixelOffice(document.getElementById("office"));
      office.on("chat", ({ who, body, kind }) => addMsg(who, body, kind));
      office.on("select", (a) => {
        selectedId = a?.id || null;
        if (!a) {
          detail.classList.remove("open");
          renderAgents(office.getAgents());
          return;
        }
        detail.classList.add("open");
        document.getElementById("detailName").textContent = a.name;
        document.getElementById("detailRole").textContent = a.role;
        document.getElementById("detailTask").textContent = `Задача: ${a.task}`;
        document.getElementById("detailThought").textContent = `Мысль: ${a.thought}`;
        renderAgents(office.getAgents());
      });
      office.on("tick", ({ busy, agents }) => {
        simMin += 0.04;
        const hh = Math.floor(simMin / 60) % 24;
        const mm = Math.floor(simMin % 60);
        document.getElementById("clock").textContent =
          `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
        document.getElementById("onlineCount").textContent = `${agents.length} online`;
        document.getElementById("taskStat").textContent = `${busy} в работе`;
        if (document.getElementById("panel-agents").classList.contains("active")) {
          renderAgents(agents);
        }
      });

      try {
        office.setOverlayEl(document.getElementById("pixOverlay"));
        await office.init();
        document.getElementById("loading").classList.add("hidden");
        renderAgents(office.getAgents());
      } catch (err) {
        document.getElementById("loading").textContent = "Ошибка загрузки: " + err.message;
        console.error(err);
      }
    })();
  </script>
</body>
</html>
